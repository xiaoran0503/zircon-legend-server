name: Build and Push Server Image

on:
  push:
    branches:
      - main
      - feature/net10-modernize
    paths:
      - 'Server/**'
      - 'Library/**'
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  IMAGE_NAME: xiaoran05032/zircon-legend-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout submodule from fork
        run: |
          git config --global url."https://github.com/xiaoran0503/".insteadOf "https://github.com/raphaelcheung/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:net10-1.14.0
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
